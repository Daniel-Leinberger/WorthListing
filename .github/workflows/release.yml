# Packages the add-on and uploads it to CurseForge and GitHub Releases
# whenever a version tag (e.g. v1.0.0) is pushed.
# Needs the repository secret CF_API_KEY and "## X-Curse-Project-ID" in the .toc.

name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: BigWigsMods/packager@v2
